<!--
  ============ 城市活动晨报 · 城市漫游手册 ============
  定调：旅行志博客 —— 大幅城市封面 + 思源宋体标题 + 陶土色强调 + 侧栏部件
  展示字：Fraunces（拉丁斜体）+ Noto Serif SC（中文标题）
  正文：Noto Sans SC；数据：IBM Plex Mono

  结构：固定顶栏（品牌 + 六大板块菜单 + 城市 + 搜索 + 主题）
        封面横幅（随页面滚动收起）
        主栏：活动列表（单行卡片 + 分页） / 侧栏：城市卡 · 板块 · 区域 · 最近截止

  数据契约（与自动化任务绑定，禁止改动）：
    data/cities.json          [{key,name,en}]
    data/events-<key>.json    {updated,items:[{cat,title,date,end,venue,area,price,desc,top,alert,kid,sold,url,source}]}
  kid / sold 为可选布尔值（紧跟 alert）：kid = 适合带 3—12 岁儿童；sold = 已无票，卡片置灰并标「已售罄」。
  alert 只放时效与观赏状态（见 tools/validate.mjs 白名单），票务过程写进 price。
  url/source 可缺省（旧数据），缺省时卡片点击走搜索入口。
  新增城市只要在 cities.json 加一行，并在 assets/ 放 city-<key>.jpg。
  每条活动的 url 指向可信度最高的原始出处，卡片点击新开页签跳转；没有 url 时退化为搜索入口。
-->

    <!-- ============ 侧栏 ============ -->

</button>

<script>
"use strict";
(function () {

/* ======================================================================
   1. 常量与状态
   ====================================================================== */
var DATA_BASE = "data";
var ASSET = "assets";
var FAV_KEY = "city-events-favs";
var CITY_KEY = "city-events-city";
var THEME_KEY = "city-events-theme";
var PAGE_SIZE = 12;
var DAY = 86400000;

var CATS = [
  { key: "exhibition", name: "展览",     en: "Exhibition" },
  { key: "market",     name: "会展市集", en: "Market" },
  { key: "outdoor",    name: "户外赏花", en: "Outdoor" },
  { key: "preview",    name: "提前预告", en: "Upcoming" },
  { key: "bloom",      name: "花期预警", en: "Bloom" },
  { key: "night",      name: "夜游推荐", en: "Night" }
];
var CAT_BY = {};
CATS.forEach(function (c) { CAT_BY[c.key] = c; });

/* 顶栏菜单 = 全部 + 本周必去 + 六大板块 */
var MENU = [{ key: "all", name: "全部" }, { key: "top", name: "本周必去" }].concat(
  CATS.map(function (c) { return { key: c.key, name: c.name }; })
);

var CITY_NOTES = {
  gz: "珠江两岸的展览、骑楼下的市集、白云山下的花期。",
  sz: "海边的日落、创意园的展览、湾区的夜。",
  cs: "湘江边的烟火、岳麓山下的书院、五一广场的夜宵。"
};

var state = { city: null, cat: "all", q: "", free: false, fav: false, kid: false, area: "", page: 1 };
var cityIndex = [];
var cache = {};
var updated = {};
var favSet = new Set();

/* ======================================================================
   2. 工具
   ====================================================================== */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function todayDate() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseEnd(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function daysLeft(end) {
  var d = parseEnd(end);
  return d ? Math.round((d - todayDate()) / DAY) : null;
}
function shortEnd(end) {
  var d = parseEnd(end);
  return d ? (d.getMonth() + 1) + "." + d.getDate() : "长期";
}
function dateCn() {
  var d = new Date();
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · 周" + "日一二三四五六".charAt(d.getDay());
}
function issueNo() {
  var n = new Date();
  return Math.floor((n - new Date(n.getFullYear(), 0, 1)) / DAY) + 1;
}
function prefersReduce() {
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function highlight(raw) {
  var text = String(raw == null ? "" : raw);
  var q = state.q.trim();
  if (!q) return esc(text);
  var safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var parts;
  try { parts = text.split(new RegExp("(" + safe + ")", "gi")); }
  catch (e) { return esc(text); }
  var out = "";
  for (var i = 0; i < parts.length; i++) {
    out += i % 2 ? "<mark>" + esc(parts[i]) + "</mark>" : esc(parts[i]);
  }
  return out;
}
function loadFavs() {
  try {
    var arr = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    if (Array.isArray(arr)) favSet = new Set(arr.filter(function (x) { return typeof x === "string"; }));
  } catch (e) { favSet = new Set(); }
}
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favSet))); } catch (e) {} }
function favId(it) { return state.city + "\u0001" + it.title; }
function isFav(it) { return favSet.has(favId(it)); }
/* 详情不自己做：直接跳到这条活动可信度最高的原始出处；没有采集到出处就不给可点入口 */
function hasSource(it) { return !!(it.url && /^https:\/\//i.test(it.url)); }
function sourceLabel() { return "打开出处"; }

/* ======================================================================
   3. 数据
   ====================================================================== */
function getJSON(url) {
  return fetch(url, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function liveItems() {
  var list = cache[state.city];
  if (!Array.isArray(list)) return [];
  return list.filter(function (it) { var d = daysLeft(it.end); return d === null || d >= 0; });
}
function isBroken() { return cache[state.city] === null; }
function curCity() {
  for (var i = 0; i < cityIndex.length; i++) if (cityIndex[i].key === state.city) return cityIndex[i];
  return null;
}
function loadCity(key) {
  if (key in cache) return Promise.resolve();
  return getJSON(DATA_BASE + "/events-" + key + ".json").then(function (j) {
    cache[key] = Array.isArray(j) ? j : (j && Array.isArray(j.items) ? j.items : []);
    updated[key] = (j && j.updated) || "";
  }).catch(function () {
    cache[key] = null;
    updated[key] = "";
  });
}

/* ======================================================================
   4. 筛选
   ====================================================================== */
function isTopFilter() { return state.cat === "top"; }
function matches(it) {
  if (isTopFilter()) { if (!it.top) return false; }
  else if (state.cat !== "all" && it.cat !== state.cat) return false;
  if (state.area && it.area !== state.area) return false;
  if (state.free && !/免费/.test(it.price || "")) return false;
  if (state.kid && !it.kid) return false;
  if (state.fav && !isFav(it)) return false;
  var q = state.q.trim().toLowerCase();
  if (q) {
    var hay = [it.title, it.venue, it.area, it.price, it.desc, it.date].join(" ").toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  return true;
}
function filtered() {
  return !!(state.q.trim() || state.free || state.kid || state.fav || state.area || state.cat !== "all");
}
function sortByEnd(arr) {
  return arr.slice().sort(function (a, b) {
    var ae = a.end ? 0 : 1, be = b.end ? 0 : 1;
    if (ae !== be) return ae - be;
    if (!a.end) return 0;
    return a.end < b.end ? -1 : a.end > b.end ? 1 : 0;
  });
}

/* ======================================================================
   5. 渲染：顶栏菜单
   ====================================================================== */
function menuHTML() {
  return MENU.map(function (m) {
    var on = state.cat === m.key;
    return '<button type="button" class="menu-item' + (on ? " on" : "") + '" data-menu="' + m.key +
      '" aria-current="' + (on ? "page" : "false") + '">' + esc(m.name) + "</button>";
  }).join("");
}
function renderMenu() {
  $("#menu").innerHTML = menuHTML();
  $("#tabs").innerHTML = menuHTML();
}

function renderCityNav() {
  var el = $("#citynav");
  el.innerHTML = cityIndex.map(function (c) {
    return '<button type="button" class="city-pill" data-city="' + esc(c.key) + '" aria-pressed="' +
      (c.key === state.city ? "true" : "false") + '">' + esc(c.name) + "</button>";
  }).join("");
}

/* ======================================================================
   6. 渲染：封面 + 侧栏
   ====================================================================== */
function renderBanner() {
  var c = curCity();
  if (!c) return;
  var items = liveItems();
  $("#kicker").textContent = dateCn() + " · 第 " + issueNo() + " 期";
  $("#cityName").textContent = c.name;
  $("#cityEn").textContent = c.en;
  var note = CITY_NOTES[c.key] || "展览、市集、赏花、演出与夜游。";
  $("#heroLead").innerHTML = '<span class="lead-note">' + esc(note) +
    '</span> <span class="lead-count">这周有 <b id="heroCount">' + items.length + "</b> 个地方值得出门。</span>";
    var img = $("#heroImg");
  img.alt = c.name + "城市照片";
  var src = ASSET + "/city-" + c.key + ".jpg";
  if (img.getAttribute("src") !== src) {
    img.style.opacity = "0";
    var pre = new Image();
    pre.onload = function () { img.src = src; img.style.opacity = "1"; };
    pre.onerror = function () { img.style.opacity = "1"; };
    pre.src = src;
  }
  document.title = c.name + "这周去哪 · " + items.length + " 个去处 ｜ 城市活动晨报";
}

function renderSidebar() {
  var c = curCity();
  if (!c) return;
  var items = liveItems();
  var topN = 0, freeN = 0;
  items.forEach(function (it) {
    if (it.top) topN++;
    if (/免费/.test(it.price || "")) freeN++;
  });

  var areas = {};
  items.forEach(function (it) { if (it.area) areas[it.area] = (areas[it.area] || 0) + 1; });
  var topAreas = Object.keys(areas).sort(function (a, b) { return areas[b] - areas[a]; }).slice(0, 14);
  $("#tagCloud").innerHTML = topAreas.length
    ? topAreas.map(function (a) {
        return '<button type="button" class="tag' + (state.area === a ? " on" : "") + '" data-area="' +
          esc(a) + '">' + esc(a) + "<i>" + areas[a] + "</i></button>";
      }).join("")
    : '<span style="font-size:11.5px;color:var(--muted)">本期数据还没标区域</span>';

  var soon = items.filter(function (it) {
    var d = daysLeft(it.end);
    return d !== null && d >= 0 && d <= 7;
  }).sort(function (a, b) { return a.end < b.end ? -1 : 1; }).slice(0, 5);
  $("#miniList").innerHTML = soon.length ? soon.map(function (it) {
    var inner = '<span class="mini-date">' + esc(shortEnd(it.end)) + "</span>" +
      '<span class="mini-title">' + esc(it.title) + "</span>";
    return "<li>" + (hasSource(it)
      ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + inner + "</a>"
      : '<span class="mini-static">' + inner + "</span>") + "</li>";
  }).join("") : '<li style="padding:8px 0;font-size:11.5px;color:var(--muted)">7 天内没有截止的活动</li>';
}

/* ======================================================================
   7. 渲染：列表 + 分页
   ====================================================================== */
function countdownChip(it) {
  var d = daysLeft(it.end);
  if (d === null || d < 0) return "";
  if (d === 0) return '<span class="chip-days">今天截止</span>';
  if (d === 1) return '<span class="chip-days">明天截止</span>';
  if (d <= 7) return '<span class="chip-days">剩 ' + d + " 天</span>";
  return '<span class="chip-days soon">剩 ' + d + " 天</span>";
}
function favBtn(it) {
  var on = isFav(it);
  return '<button class="fav" type="button" data-fav="' + esc(it.title) + '"' +
    ' aria-pressed="' + (on ? "true" : "false") + '" aria-label="' + (on ? "取消收藏 " : "收藏 ") + esc(it.title) + '">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 20s-7-4.4-7-9.3A4.1 4.1 0 0 1 12 7.6 4.1 4.1 0 0 1 19 10.7C19 15.6 12 20 12 20Z"/></svg></button>';
}
function priceTag(it) {
  var p = it.price || "";
  if (!p) return "";
  return '<span class="price' + (/免费/.test(p) ? " free" : "") + '">' + esc(p) + "</span>";
}

function cardHTML(it, i) {
  var c = CAT_BY[it.cat] || CATS[0];
  var sold = it.sold === true;
  var meta = [];
  meta.push('<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>' + esc(it.date || "长期") + "</span>");
  if (it.venue) meta.push('<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>' + esc(it.venue) + "</span>");
  if (it.area) meta.push("<span>" + esc(it.area) + "</span>");

  return '<article class="card cat-' + it.cat + (sold ? " is-sold" : "") + '" style="--i:' + Math.min(7, i) + '">' +
    (hasSource(it) ? '<a class="card-hit" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer" aria-label="打开 ' + esc(it.title) + ' 的原始出处"></a>' : "") +
    '<div class="card-main">' +
      '<div class="card-top">' +
        '<span class="chip-cat"><i style="width:6px;height:6px;border-radius:50%;background:var(--cc)"></i>' + esc(c.name) + "</span>" +
        (it.kid ? '<span class="chip-kid">亲子</span>' : "") +
        (it.sold ? '<span class="chip-sold">已售罄</span>' : "") +
        (it.alert ? '<span class="chip-alert">' + esc(it.alert) + "</span>" : "") +
        countdownChip(it) +
      "</div>" +
      '<h3 class="card-title">' + highlight(it.title) + "</h3>" +
      '<p class="card-meta">' + meta.join("") + "</p>" +
      (it.desc ? '<p class="card-desc">' + esc(it.desc) + "</p>" : "") +
    "</div>" +
    '<div class="card-side">' + priceTag(it) +
      '<span class="card-actions">' +
        (hasSource(it)
          ? (it.source ? '<span class="chip-src" title="来源">' + esc(it.source) + "</span>" : "") +
            '<a class="go" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + sourceLabel() +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>'
          : "") +
        favBtn(it) + "</span>" +
    "</div>" +
  "</article>";
}

function pagerHTML(page, pages) {
  if (pages <= 1) return "";
  var set = {};
  [1, page - 1, page, page + 1, pages].forEach(function (p) {
    if (p >= 1 && p <= pages) set[p] = 1;
  });
  var keys = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  var prev = 0, nums = "";
  keys.forEach(function (p) {
    if (prev && p - prev > 1) nums += '<span class="pg-gap" aria-hidden="true">…</span>';
    nums += '<button class="pg-num' + (p === page ? " on" : "") + '" type="button" data-page="' + p +
      '" aria-current="' + (p === page ? "page" : "false") + '" aria-label="第 ' + p + ' 页">' + p + "</button>";
    prev = p;
  });
  return '<nav class="pager" aria-label="分页">' +
    '<button class="pg-btn" type="button" data-page="' + (page - 1) + '"' + (page <= 1 ? " disabled" : "") + '>上一页</button>' +
    '<span class="pg-nums">' + nums + "</span>" +
    '<span class="pg-now">' + page + " / " + pages + "</span>" +
    '<button class="pg-btn" type="button" data-page="' + (page + 1) + '"' + (page >= pages ? " disabled" : "") + '>下一页</button>' +
    "</nav>";
}

function renderHead(list) {
  var name = "全部活动", en = "all events";
  if (isTopFilter()) { name = "本周必去"; en = "this week"; }
  else if (state.cat !== "all" && CAT_BY[state.cat]) { name = CAT_BY[state.cat].name; en = CAT_BY[state.cat].en; }
  $("#allTitle").textContent = name;
  $("#allEn").textContent = en;
}

function renderGroups() {
  var box = $("#groups");
  var all = liveItems();
  var list = sortByEnd(all.filter(matches));
  var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;
  var page = state.page;
  var slice = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  renderHead(list);

  var extra = [];
  if (state.area) extra.push('<button type="button" class="clear-area" data-clear-area>区域 · ' + esc(state.area) + " ✕</button>");
  var sc = $("#spCount");
  if (sc) sc.textContent = list.length + " 条";
  $("#result").innerHTML = (filtered() ? "筛选出 " + list.length + " 条" : "共 " + list.length + " 条") +
    (list.length ? " · 第 " + page + " / " + pages + " 页 · 按截止时间由近到远 " : "") + extra.join("");

  if (isBroken()) {
    box.innerHTML = '<div class="empty"><b>这个城市版暂时没取到</b><p>数据文件加载失败，刷新一次试试</p>' +
      '<button type="button" data-retry>重新加载</button></div>';
    return;
  }
  if (list.length === 0) {
    box.innerHTML = '<div class="empty"><b>没有匹配的活动</b><p>' +
      (state.fav ? "收藏夹还是空的，点卡片右侧的爱心存一条" : "换个关键词，或清空筛选看看全部 " + all.length + " 条") +
      '</p><button type="button" data-reset>清空筛选</button></div>';
    return;
  }

  box.innerHTML = '<div class="cards">' +
    slice.map(function (it, i) { return cardHTML(it, i); }).join("") +
    "</div>" + pagerHTML(page, pages);
}

function renderAll() {
  renderMenu();
  renderCityNav();
  renderBanner();
  renderSidebar();
  renderGroups();
  applyFavLabels();
  syncMini();
}

/* ======================================================================
   8. 交互
   ====================================================================== */
function setFilter(patch) {
  Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
  state.page = 1;
  renderMenu();
  renderSidebar();
  renderGroups();
  syncMini();
}
function gotoList() {
  var b = $("#browse");
  if (!b) return;
  var top = b.getBoundingClientRect().top + window.scrollY - (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--stick"), 10) || 64) - 10;
  window.scrollTo({ top: Math.max(0, top), behavior: prefersReduce() ? "auto" : "smooth" });
}

function switchCity(key) {
  if (key === state.city) return;
  state.city = key;
  document.body.dataset.scene = key;
  state.cat = "all"; state.q = ""; state.free = false; state.kid = false; state.fav = false; state.area = ""; state.page = 1;
  syncQuery();
  try { localStorage.setItem(CITY_KEY, key); } catch (e) {}
  $("#groups").innerHTML = '<div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>';
  syncSearchUI();
  loadCity(key).then(function () {
    renderAll();
    var y = window.scrollY || window.pageYOffset || 0;
    if (y > window.innerHeight * 0.6) gotoList();
  });
}
function syncQuery() {
  try { history.replaceState(null, "", state.city ? "?city=" + state.city : location.pathname); } catch (e) {}
}
function toggleFav(title, silent) {
  var key = state.city + "\u0001" + title;
  var on = favSet.has(key);
  if (on) favSet.delete(key); else favSet.add(key);
  saveFavs();
  applyFavLabels();
  var n = 0;
  liveItems().forEach(function (it) { if (isFav(it)) n++; });
  syncMini();
  if (!silent) toast(on ? "已取消收藏" : "已收藏 · 共 " + n + " 条");
  if (state.fav) renderGroups();
}
function applyFavLabels() {
  $$("[data-fav]").forEach(function (btn) {
    var title = btn.getAttribute("data-fav");
    var on = favSet.has(state.city + "\u0001" + title);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", (on ? "取消收藏 " : "收藏 ") + title);
  });
}
function syncMini() {
  var n = 0;
  liveItems().forEach(function (it) { if (isFav(it)) n++; });
  $("#favN").textContent = n;
  $("#freeBtn").setAttribute("aria-pressed", state.free ? "true" : "false");
  $("#kidBtn").setAttribute("aria-pressed", state.kid ? "true" : "false");
  $("#kidBtn").style.color = state.kid ? "var(--accent)" : "";
  $("#kidBtn").style.borderColor = state.kid ? "currentColor" : "";
  $("#favBtn").setAttribute("aria-pressed", state.fav ? "true" : "false");
  $("#favBtn").style.color = state.fav ? "var(--accent)" : "";
  $("#favBtn").style.borderColor = state.fav ? "currentColor" : "";
}
var toastTimer = null;
function toast(msg) {
  var el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("on"); }, 1900);
}
function syncSearchUI() {
  var q = $("#q");
  if (q.value !== state.q) q.value = state.q;
  $("#qClear").hidden = !state.q;
}
function setQuery(v) {
  state.q = v;
  syncSearchUI();
  state.page = 1;
  renderGroups();
}
function resetFilters() {
  state.cat = "all"; state.q = ""; state.free = false; state.kid = false; state.fav = false; state.area = ""; state.page = 1;
  syncSearchUI(); renderMenu(); renderSidebar(); renderGroups(); syncMini();
}

/* 搜索浮层 */
function openSearch() {
  $("#searchPanel").classList.add("on");
  $("#searchBackdrop").hidden = false;
  document.body.classList.add("search-open");
  $("#searchBtn").setAttribute("aria-expanded", "true");
  setTimeout(function () { $("#q").focus(); }, 60);
}
function closeSearch() {
  $("#searchPanel").classList.remove("on");
  $("#searchBackdrop").hidden = true;
  document.body.classList.remove("search-open");
  $("#searchBtn").setAttribute("aria-expanded", "false");
}

function bind() {
  document.addEventListener("click", function (e) {
    var menuBtn = e.target.closest("[data-menu]");
    if (menuBtn) {
      setFilter({ cat: menuBtn.getAttribute("data-menu") });
      closeSearch();
      gotoList();
      return;
    }
    var cityBtn = e.target.closest("button[data-city]");
    if (cityBtn) { switchCity(cityBtn.getAttribute("data-city")); return; }
    var areaBtn = e.target.closest("[data-area]");
    if (areaBtn) {
      var a = areaBtn.getAttribute("data-area");
      setFilter({ area: state.area === a ? "" : a });
      if (state.area) gotoList();
      return;
    }
    if (e.target.closest("[data-clear-area]")) { setFilter({ area: "" }); return; }
    if (e.target.closest("[data-free]")) { setFilter({ free: !state.free }); return; }
    if (e.target.closest("[data-kid]")) { setFilter({ kid: !state.kid }); return; }
    if (e.target.closest("[data-favonly]")) { setFilter({ fav: !state.fav }); return; }

    var fav = e.target.closest("[data-fav]");
    if (fav) { toggleFav(fav.getAttribute("data-fav")); return; }

    var pg = e.target.closest("[data-page]");
    if (pg && !pg.disabled) {
      var n = parseInt(pg.getAttribute("data-page"), 10);
      if (n && n !== state.page) {
        state.page = n;
        renderGroups();
        gotoList();
      }
      return;
    }
    if (e.target.closest("[data-reset]")) { resetFilters(); return; }
    if (e.target.closest("[data-retry]")) {
      delete cache[state.city];
      $("#groups").innerHTML = '<div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>';
      loadCity(state.city).then(renderAll);
      return;
    }
  });

  $("#searchBtn").addEventListener("click", openSearch);
  $("#qClose").addEventListener("click", closeSearch);
  $("#searchBackdrop").addEventListener("click", closeSearch);
  $("#themeBtn").addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  $("#totop").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: prefersReduce() ? "auto" : "smooth" });
  });

  var q = $("#q");
  var timer = null;
  q.addEventListener("input", function () {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = q.value.trim();
      $("#qClear").hidden = !q.value;
      state.page = 1;
      renderGroups();
    }, 130);
  });
  $("#qClear").addEventListener("click", function () {
    q.value = ""; state.q = ""; $("#qClear").hidden = true; state.page = 1; renderGroups(); q.focus();
  });

  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); openSearch(); q.select(); return; }
    if (e.key === "Escape") { closeSearch(); if (document.activeElement === q) q.blur(); return; }
    if (!typing && e.key === "/") { e.preventDefault(); openSearch(); }
  });

  var ticking = false;
  function onScroll() {
    var y = window.scrollY || window.pageYOffset || 0;
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var bar = $("#progressBar");
    if (bar) bar.style.width = (h > 0 ? Math.min(1, y / h) * 100 : 0).toFixed(2) + "%";
    var banner = $("#banner");
    var threshold = (banner ? banner.offsetHeight : 400) - 70;
    $("#topbar").classList.toggle("solid", y > threshold);
    $("#totop").classList.toggle("on", y > 700);
    ticking = false;
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  window.addEventListener("resize", onScroll);
  onScroll();
}

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "dark" ? "#0a1118" : "#f3f7fa");
  $("#themeBtn").setAttribute("aria-pressed", t === "dark" ? "true" : "false");
}

/* ======================================================================
   9. 启动
   ====================================================================== */
function boot() {
  loadFavs();
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  bind();

  getJSON(DATA_BASE + "/cities.json").then(function (j) {
    if (!Array.isArray(j) || j.length === 0) throw new Error("empty");
    cityIndex = j;
    var key = "";
    try {
      var qp = new URLSearchParams(location.search).get("city");
      if (qp && cityIndex.some(function (c) { return c.key === qp; })) key = qp;
    } catch (e) {}
    if (!key) {
      try {
        var saved = localStorage.getItem(CITY_KEY);
        if (saved && cityIndex.some(function (c) { return c.key === saved; })) key = saved;
      } catch (e) {}
    }
    if (!key) key = cityIndex[0].key;
    state.city = key;
    document.body.dataset.scene = key;
    syncQuery();
    return loadCity(key).then(renderAll);
  }).catch(function () {
    $("#groups").innerHTML = '<div class="empty"><b>城市列表加载失败</b><p>请刷新页面重试</p></div>';
    $("#kicker").textContent = "OFFLINE";
  });
}

boot();

})();
</script>
</body>
</html>
